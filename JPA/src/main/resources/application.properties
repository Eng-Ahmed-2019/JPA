spring.application.name=JPA

# to save logging in file
logging.file.name=logs/application.log

#PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/TestDB
spring.datasource.username=postgres
spring.datasource.password=946201.Com.Com
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate
#Hibernate يحاول يحدّث الـ Schema
spring.jpa.hibernate.ddl-auto=update

#Display SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#SQL Logging
#عرض SQL في الـ Logs
logging.level.org.hibernate.SQL=DEBUG
#عرض قيم Parameters المربوطة بالـ SQL
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Root logging level
logging.level.root=ERROR
# Our application
logging.level.com.ahmed.JPA=WARN
# Spring
logging.level.org.springframework=INFO
# Package
logging.level.com.ahmed.JPA.service=DEBUG
logging.level.com.ahmed.JPA.repository=WARN
logging.level.com.ahmed.JPA.controller=TRACE